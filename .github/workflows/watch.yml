name: estate-watch
on:
  schedule:
    - cron: "*/30 * * * *"        # every 30 min
  workflow_dispatch:
    inputs:
      simulate_fail:
        description: "Set to a bogus URL to force a probe failure (test the issue path)"
        required: false
        default: ""
permissions:
  issues: write
concurrency:
  group: estate-watch
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Restore flap state
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: estate-watch-state-${{ github.run_id }}
          restore-keys: estate-watch-state-
      - name: Probe estate
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE_FAIL: ${{ github.event.inputs.simulate_fail }}
        run: |
          set -u
          HEARTBEAT_RAW="https://gist.githubusercontent.com/bigbrownjeff/6f2873eb3b1936fea67efc4ae3546aea/raw/heartbeat.txt"
          STALE_HOURS="2.5"
          declare -a DOWN=()
          # Follow redirects and judge the terminal response. A 3xx is not green by
          # itself: it may point at a dead or unintended host. Mode `public` requires
          # terminal 2xx; mode `reachable` also accepts an intentional 401/403
          # gate. When mode `gated` declares an Access host, even a 401/403 must
          # terminate on that host; a generic origin/bot denial is not gate proof.
          # An ordinary public 200 is a failure. Optional $5 is a public marker.
          check_url () {  # $1 name  $2 url  $3 public|reachable|gated  $4 access-host  $5 marker
            body=$(mktemp)
            probe=$(curl -sS -L --max-redirs 5 -A "Mozilla/5.0 estate-watch/1.0" -o "$body" -w "%{http_code}|%{url_effective}" -m 20 "$2?cb=$RANDOM" 2>/dev/null)
            curl_rc=$?
            code=${probe%%|*}
            effective=${probe#*|}
            # Access login redirects carry signed query metadata. Status checks
            # need the host/path only, so never print query strings into public
            # Actions logs or incident bodies.
            effective_safe=${effective%%\?*}
            effective_safe=${effective_safe%%\#*}
            effective_host=${effective_safe#*://}
            effective_host=${effective_host%%/*}
            effective_host=${effective_host%%:*}
            if [ "$curl_rc" -ne 0 ] || [ -z "$code" ]; then code=000; fi
            mode=${3:-reachable}
            access_host=${4:-}
            marker=${5:-}
            healthy=0
            case "$mode:$code" in
              public:2*|reachable:2*|reachable:401|reachable:403)
                healthy=1;;
              gated:401|gated:403)
                if [ -z "$access_host" ] || [ "$effective_host" = "$access_host" ]; then healthy=1; fi;;
              gated:2*)
                if [ -n "$access_host" ] && [ "$effective_host" = "$access_host" ]; then healthy=1; fi;;
            esac
            if [ "$healthy" = "1" ] && [ "$mode" = "public" ] && [ -n "$marker" ]; then
              if ! grep -Fqi -- "$marker" "$body"; then healthy=0; fi
            fi
            if [ "$healthy" = "1" ]; then
              echo "UP   $1 ($code -> $effective_safe)"
            else
              echo "DOWN $1 ($code -> $effective_safe; expected $mode)"
              DOWN+=("$1:$code")
            fi
            rm -f "$body"
          }
          if [ -n "${SIMULATE_FAIL:-}" ]; then check_url "SIMULATED" "$SIMULATE_FAIL" public; fi
          check_url "jeffpinto.com"        "https://jeffpinto.com/" public
          check_url "prevalence-audit"     "https://prevalence-audit.jeffpinto.com/" reachable
          check_url "rvc-taxes"            "https://rvc-taxes.jeffpinto.com/" public
          check_url "crm.bluecamel"        "https://crm.bluecamelconsulting.com/" gated "cold-waterfall-c527.cloudflareaccess.com"
          # Blue Camel soft-launch proof surfaces are intentionally public. A
          # 401/403 here is access-regression, not healthy gating.
          check_url "brand-safety-demo"    "https://brand-safety-demo.pages.dev/" public
          check_url "cc-compliance-demo"   "https://cc-compliance-demo.pages.dev/" public
          check_url "camh-subgroup-demo"   "https://camh-subgroup-demo.pages.dev/" public
          # Tunnel-backed surfaces: origin is the laptop, so cloudflared dying takes these
          # down while the edge sites stay green. Lantern is the one with real users.
          check_url "tunnel:lantern-watch" "https://watch.lantern.family/" reachable
          check_url "tunnel:atlas"         "https://atlas.lantern.family/" reachable
          check_url "tunnel:notes"         "https://notes.jeffpinto.com/" reachable
          check_url "tunnel:bluecamel"     "https://bluecamelconsulting.com/" public "" "Blue Camel"
          # --- Orphan estate (groundskeeper), added 2026-09-04 -------------------
          # These are the surfaces no domain persona owns: the client-pitch
          # one-pagers a prospect may be reading right now, the client review
          # bundles, the open-source demo, and the gated client properties.
          # None of them were watched before, which is the blind spot that let a
          # 4-day-old incident on an unlisted host go unseen on 2026-08-03. Each
          # public check carries a body marker so a wrong-bundle deploy that
          # still returns 200 is caught, not just a 404.
          check_url "pitch:forus"          "https://forus.jeffpinto.com/" public "" "Three problems worth solving at Forus"
          check_url "pitch:level-agency"   "https://level-agency.jeffpinto.com/" public "" "Three tools the benchmarks report wants to become"
          check_url "pitch:grand-canyon"   "https://grand-canyon.jeffpinto.com/" public "" "Grand Canyon Education"
          check_url "pitch:covista"        "https://covista.jeffpinto.com/" public "" "Three reads of Covista"
          check_url "pitch:clearshift"     "https://clearshift.jeffpinto.com/" public "" "ClearShift"
          check_url "bundle:iqvia-canada"  "https://iqvia-canada.pages.dev/" public "" "review bundle"
          check_url "bundle:idesign"       "https://idesign-4ui.pages.dev/" public "" "review bundle"
          check_url "bundle:arena"         "https://arena-6og.pages.dev/" public "" "review bundle"
          check_url "bundle:straighterline" "https://straighterline.pages.dev/" public "" "review bundle"
          check_url "bundle:descript"      "https://descript-e3c.pages.dev/" public "" "review bundle"
          check_url "bundle:smithrx"       "https://smithrx.pages.dev/" public "" "review bundle"
          check_url "bundle:corgi"         "https://corgi-insurance.pages.dev/" public "" "review bundle"
          check_url "bridgetheiep"         "https://bridgetheiep.pages.dev/" public "" "Bridge the IEP"
          check_url "loop-lab"             "https://loop-lab.jeffpinto.com/" public "" "Loop Lab"
          check_url "solar-sizing"         "https://bigbrownjeff.github.io/solar-sizing/" public "" "Honest solar sizing"
          # Gated client properties. A 200 that does NOT terminate on the Access
          # host is an open gate, which is the failure this mode exists to catch.
          check_url "gated:cashflow"       "https://cashflow.jeffpinto.com/" gated "cold-waterfall-c527.cloudflareaccess.com"
          check_url "gated:line-judge-drift" "https://line-judge-drift-f1d8e1.jeffpinto.com/" gated "cold-waterfall-c527.cloudflareaccess.com"
          check_url "gated:launchpad"      "https://links.jeffpinto.com/" gated "cold-waterfall-c527.cloudflareaccess.com"
          # clearshift-locum was excluded on 2026-09-04 to keep its unguessable slug
          # out of a public repo; Jeff reversed that the same day ("make sure it's
          # public"): Access is the control, and an open gate on this host must read
          # DOWN like the others.
          check_url "gated:clearshift-locum" "https://clearshift-locum-9f3a72.pages.dev/" gated "cold-waterfall-c527.cloudflareaccess.com"
          # Laptop heartbeat (dead-man's-switch): gist timestamp fresh?
          hb=$(curl -s -m 20 "$HEARTBEAT_RAW" | head -1 | tr -d '[:space:]')
          if [ -z "$hb" ]; then
            echo "DOWN laptop-heartbeat (unreachable)"; DOWN+=("laptop-heartbeat:unreachable")
          else
            age_h=$(python3 -c "import sys,datetime;t=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'));print((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()/3600)" "$hb" 2>/dev/null || echo 999)
            stale=$(python3 -c "print(1 if float('$age_h')>float('$STALE_HOURS') else 0)")
            if [ "$stale" = "1" ]; then echo "DOWN laptop-heartbeat (stale ${age_h}h)"; DOWN+=("laptop-heartbeat:stale"); else echo "UP   laptop-heartbeat (${age_h}h)"; fi
          fi
          {
            echo "failing=$([ ${#DOWN[@]} -gt 0 ] && echo true || echo false)"
            echo "down_csv=$(IFS=,; echo "${DOWN[*]:-}")"
          } >> "$GITHUB_OUTPUT"
      - name: Update flap counter + alert
        env:
          GH_TOKEN: ${{ github.token }}
          FAILING: ${{ steps.probe.outputs.failing }}
          DOWN_CSV: ${{ steps.probe.outputs.down_csv }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          mkdir -p .state
          consec=$(cat .state/consec_fail 2>/dev/null || echo 0)
          issue=$(gh issue list --repo "$REPO" --label estate-incident --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ "$FAILING" = "true" ]; then
            consec=$((consec+1)); echo "$consec" > .state/consec_fail
            if [ "$consec" -ge 2 ]; then
              # Name the failure shape so the incident says what to go fix.
              tunnels=$(printf '%s' "$DOWN_CSV" | tr ',' '\n' | grep -c '^tunnel:' || true)
              others=$(printf '%s' "$DOWN_CSV" | tr ',' '\n' | grep -vc '^tunnel:' || true)
              if printf '%s' "$DOWN_CSV" | grep -q 'laptop-heartbeat'; then
                diag="**Laptop is dark or offline.** Local launchd jobs are not running and every tunnel-backed surface goes down with it. Edge sites (Pages) are unaffected. Check network, then \`launchctl list | grep jeffpinto\`."
              elif [ "$tunnels" -gt 0 ] && [ "$others" -eq 0 ]; then
                diag="**Tunnel failure with the laptop alive** (heartbeat is fresh). cloudflared died but launchd jobs are fine — kickstart the affected \`com.jeffpinto.*-tunnel\` job(s)."
              elif [ "$tunnels" -gt 0 ]; then
                diag="Mixed edge + tunnel failure — check Cloudflare status before touching the laptop."
              else
                diag="Edge surface down while the laptop is healthy — suspect a Cloudflare Pages deploy, DNS, or the project itself."
              fi
              # NOTE: keep every line of this run: block indented. A column-0 line ends the
              # YAML block scalar and silently drops workflow_dispatch (cost an hour on 07-24),
              # so build multi-line strings with printf, never a literal newline in a quote.
              body=$(printf 'Estate-watch saw **%s** down on 2+ consecutive probes (~%s).\n\n%s\n' "$DOWN_CSV" "$(date -u +%FT%TZ)" "$diag")
              if [ -n "$issue" ]; then
                gh issue comment "$issue" --repo "$REPO" --body "Still down ($DOWN_CSV) at $(date -u +%FT%TZ)."
              else
                gh issue create --repo "$REPO" --label estate-incident --title "Estate watch: surface(s) down ($DOWN_CSV)" --body "$body"
              fi
            else
              echo "flap #1 ($DOWN_CSV) — holding one cycle before alerting."
            fi
          else
            # green: zero content writes (issues/comments) in steady state
            echo 0 > .state/consec_fail
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body "Recovered — all probes green at $(date -u +%FT%TZ)."
              gh issue close "$issue" --repo "$REPO"
            fi
          fi
      - name: Save flap state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: estate-watch-state-${{ github.run_id }}
